<h2 mat-dialog-title>Request Confirmation</h2>
<mat-dialog-content>
  <p>Do you want to request more halls from the admin?</p>
  <p>Number of registered students: {{ data.studentsCount }}</p>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="close()">Cancel</button>
  <button mat-button [mat-dialog-close]="true" cdkFocusInitial>Request</button>
</mat-dialog-actions>
