<div class="wrapper">
  <div clas="first-inner">
    <img src="assets/naslovna.png" style="width: 100%; height: 300px" />
  </div>
  <div class="second-inner">
    <div
      style="display: flex; flex-direction: row; justify-content: space-between"
    >
      <button class="first-button">
        <img src="assets/arrow-revert.png" style="width: 20px; height: 20px" />
        Previous sessions
      </button>
      <p class="title">Today's Session Schedule</p>
      <button class="second-button">
        Upcoming sessions
        <img src="assets/arrow.png" style="width: 20px; height: 20px" />
      </button>
    </div>

    <div
      class="card-wrapper"
      style="
        display: flex;
        flex-direction: row;
        gap: 50px;
        padding-left: 10%;
        padding-top: 3%;
        padding-right: 10%;
        padding-bottom: 5%;
      "
    >
      <button style="border: none; background-color: transparent">
        <img
          style="width: 30px; height: 30px"
          src="assets/left-arrow.png"
          alt="Left Arrow"
        />
      </button>
      <div class="card1" *ngFor="let session of Sessions">
        <div
          style="
            display: flex;
            flex-direction: row;
            justify-content: space-between;
          "
        >
          <p class="firstName">{{ getNextName() }}</p>
          <button
            mat-button
            style="
              color: white;
              font-size: 15px;
              margin-bottom: 5px;
              margin-right: 5px;
              background-color: rgb(42, 90, 146, 0.7);
              margin-right: 15px;
            "
            (click)="sessionHistory()"
          >
            Session history
          </button>
        </div>

        <div
          style="
            display: flex;
            flex-direction: row;
            gap: 10px;
            color: rgb(211, 206, 206);
            font-size: 18px;
          "
        >
          <p>Goal:</p>
          <p>{{ session.sessionGoal }}</p>
        </div>

        <div
          style="
            display: flex;
            flex-direction: row;
            text-align: center;
            font-size: 18px;
            gap: 15px;
            font-weight: 500;
          "
        >
          <p>{{ session.date | date : "dd.MM.yyyy" }}</p>
          <div
            style="
              display: flex;
              flex-direction: row;
              text-align: center;
              font-size: 18px;
            "
          >
            <p>
              {{ session.startTime }}
            </p>
            <p>-</p>
            <p>
              {{ session.endTime }}
            </p>
          </div>
        </div>
        <button (click)="StartSession(session.id)" class="button-style-1">
          Start session
        </button>
      </div>
      <button style="border: none; background-color: transparent">
        <img
          style="width: 30px; height: 30px"
          src="assets/right-arrow.png"
          alt="Right Arrow"
        />
      </button>
    </div>
  </div>
  <div *ngIf="displayForm" class="third-inner">
    <p class="title">Add documentation for session</p>
    <form [formGroup]="documentationForm" class="form-wrap">
      <div style="display: flex; flex: row; gap: 40px; margin-top: 20px">
        <mat-form-field class="wide-input">
          <mat-label>Topic summary:</mat-label>
          <input matInput formControlName="topicSummary" type="text" />
        </mat-form-field>
        <div style="display: flex; flex-direction: column; gap: 30px">
          <mat-form-field class="wide-input1">
            <mat-label>Emotional reactions</mat-label>
            <input matInput formControlName="emotionalReactions" type="text" />
          </mat-form-field>
          <mat-form-field class="wide-input1">
            <mat-label>Plans and notes</mat-label>
            <input matInput formControlName="plans" type="text" />
          </mat-form-field>
        </div>
        <div style="display: flex; flex-direction: column; gap: 30px">
          <button (click)="CreateDoc()" class="button-style-2">
            Create Documentation
          </button>
          <button (click)="GenerateReport()" class="button-style-2">
            Download PDF Report📄
          </button>
          <button (click)="viewJournal()" class="button-style-2">
            View change history
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
